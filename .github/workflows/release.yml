name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Windows package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = context.ref.replace('refs/tags/', '');

            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 20,
            });

            const previousRelease = releases.find((r) => r.tag_name !== currentTag);

            let commits = [];
            if (previousRelease?.tag_name) {
              const { data: compare } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: previousRelease.tag_name,
                head: currentTag,
              });
              commits = compare.commits || [];
            } else {
              const { data } = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: context.sha,
                per_page: 30,
              });
              commits = data;
            }

            const messages = commits
              .map((c) => ({
                message: c.commit.message.split('\n')[0],
                sha: c.sha.substring(0, 7),
              }))
              .filter((c) => !c.message.startsWith('Merge'));

            const features = messages.filter((c) => /^feat(\(|:|!)/i.test(c.message));
            const fixes = messages.filter((c) => /^fix(\(|:|!)/i.test(c.message));
            const chores = messages.filter((c) => /^chore(\(|:|!)/i.test(c.message));
            const others = messages.filter(
              (c) => !/^feat(\(|:|!)/i.test(c.message)
                && !/^fix(\(|:|!)/i.test(c.message)
                && !/^chore(\(|:|!)/i.test(c.message)
            );

            let notes = `## What's Changed\n\n`;

            if (features.length) {
              notes += `### ✨ New Features\n${features.map((c) => `- ${c.message} (${c.sha})`).join('\n')}\n\n`;
            }
            if (fixes.length) {
              notes += `### 🐛 Bug Fixes\n${fixes.map((c) => `- ${c.message} (${c.sha})`).join('\n')}\n\n`;
            }
            if (chores.length) {
              notes += `### 🔧 Maintenance\n${chores.map((c) => `- ${c.message} (${c.sha})`).join('\n')}\n\n`;
            }
            if (others.length) {
              notes += `### 📦 Other Changes\n${others.map((c) => `- ${c.message} (${c.sha})`).join('\n')}\n\n`;
            }

            if (previousRelease?.tag_name) {
              notes += `---\n\n**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previousRelease.tag_name}...${currentTag}`;
            }

            return notes;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: Release ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.release_notes.outputs.result }}
          tag_name: ${{ github.ref_name }}
          files: |
            release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
