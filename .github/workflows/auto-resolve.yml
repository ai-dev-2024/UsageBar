name: Auto-Resolve Issues

on:
  release:
    types: [published]

permissions:
  issues: write

jobs:
  resolve-referenced-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Close issues explicitly referenced in release notes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release = context.payload.release;
            const text = `${release?.name || ''}\n${release?.body || ''}`;

            const numbers = new Set();
            for (const match of text.matchAll(/#(\d+)/g)) {
              numbers.add(Number(match[1]));
            }

            if (numbers.size === 0) {
              core.info('No issue references found in release notes.');
              return;
            }

            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                if (issue.pull_request) {
                  core.info(`Skipping #${issue_number} (pull request).`);
                  continue;
                }

                if (issue.state === 'closed') {
                  core.info(`Issue #${issue_number} already closed.`);
                  continue;
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `✅ Closed by release **${release.tag_name}**.`
                });

                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed'
                });

                core.info(`Closed issue #${issue_number}.`);
              } catch (error) {
                core.warning(`Failed to process #${issue_number}: ${error.message}`);
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
